server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    location / { try_files $uri $uri/ =404; }
    location /_next/static/ { expires 1y; add_header Cache-Control "public, immutable"; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
